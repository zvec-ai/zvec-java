name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Build pre-compiled C libraries for all supported platforms
  # ===========================================================================
  build-libs:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # The Linux leg runs inside the same manylinux_2_28 image upstream zvec uses
    # for its own prebuilt SDK (zvec/.github/workflows/_build_prebuilt.yml), so
    # the libzvec_c_api.so attached to the release still loads on glibc 2.28
    # distros - CentOS 8, RHEL 8, Ubuntu 20.04. On the bare ubuntu-24.04 runner
    # it links glibc 2.39 and ends up demanding GLIBC_2.38.
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-15
            platform: darwin_arm64
            lib_name: libzvec_c_api.dylib
            artifact_name: zvec-libs-darwin-arm64
            container: ''
            cache_abi: host

          - name: linux-x64
            runner: ubuntu-24.04
            platform: linux_amd64
            lib_name: libzvec_c_api.so
            artifact_name: zvec-libs-linux-x64
            # Pinned dated tag, the same batch upstream uses.
            container: 'quay.io/pypa/manylinux_2_28_x86_64:2026.03.01-1'
            cache_abi: manylinux_2_28

          - name: windows-x64
            runner: windows-2025
            platform: windows_amd64
            lib_name: zvec_c_api.dll
            artifact_name: zvec-libs-windows-x64
            container: ''
            cache_abi: host

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # The manylinux image ships no Maven, and the runner's preinstalled
      # /usr/share/maven is not visible inside a container job. The linux leg
      # needs it for the "Verify Maven compile with vendor libs" step below.
      - name: Install Maven (Linux container)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          MVN_VERSION=3.9.16
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MVN_VERSION}/binaries/apache-maven-${MVN_VERSION}-bin.tar.gz" \
            | tar -xz -C /opt
          echo "/opt/apache-maven-${MVN_VERSION}/bin" >> "$GITHUB_PATH"

      # --- Version-anchored cache (same key family as publish-jar.yml, so
      #     both workflows share one cache): keyed by the zvec submodule commit ---
      - name: Resolve zvec submodule commit
        id: zvec
        shell: bash
        run: echo "sha=$(git -C zvec rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore zvec build cache
        id: cache-zvec
        uses: actions/cache/restore@v6
        with:
          path: zvec/build
          # cache_abi keeps the host-glibc and manylinux build trees apart.
          key: zvec-build-${{ matrix.name }}-${{ matrix.cache_abi }}-${{ steps.zvec.outputs.sha }}

      # --- Unix build tools ---
      - name: Set up Python (for CMake / Ninja)
        if: runner.os == 'macOS' && steps.cache-zvec.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install build tools (Unix)
        if: runner.os != 'Windows' && steps.cache-zvec.outputs.cache-hit != 'true'
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            # setup-python is skipped inside the container: the CPython it
            # downloads is built for the host glibc and will not run in a
            # glibc 2.28 image. Use the bundled CPython instead, the same way
            # upstream zvec's _build_prebuilt.yml does.
            PYBIN=$(ls -d /opt/python/cp3*/bin | head -1)
            echo "$PYBIN" >> "$GITHUB_PATH"
            export PATH="$PYBIN:$PATH"
          fi
          python3 -m pip install --upgrade pip cmake==3.30.0 ninja==1.11.1
          echo "$(python3 -c 'import site; print(site.USER_BASE)')/bin" >> "$GITHUB_PATH"
        shell: bash

      # --- Windows build tools ---
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake and Ninja (Windows)
        if: runner.os == 'Windows' && steps.cache-zvec.outputs.cache-hit != 'true'
        run: pip install cmake==3.30.0 ninja==1.11.1
        shell: pwsh

      # --- Build C-API library (skipped on cache hit) ---
      - name: Build C-API library (Unix)
        if: runner.os != 'Windows' && steps.cache-zvec.outputs.cache-hit != 'true'
        run: |
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          cd zvec
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_C_BINDINGS=ON \
            -G Ninja
          cmake --build . -j$NPROC --target zvec_c_api
          touch .zvec-build-ok
        shell: bash

      - name: Build C-API library (Windows)
        if: runner.os == 'Windows' && steps.cache-zvec.outputs.cache-hit != 'true'
        run: |
          cd zvec
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_C_BINDINGS=ON -G Ninja
          cmake --build . --target zvec_c_api -j $env:NUMBER_OF_PROCESSORS
          New-Item -ItemType File -Force -Path .zvec-build-ok | Out-Null
        shell: pwsh

      # Save as soon as the build is known good; the marker file is written
      # only by a successful build, so a later failure still leaves a reusable
      # cache. continue-on-error absorbs the 409 raised when a concurrent run
      # (e.g. a manual Publish JAR run sharing the same key) already stored it.
      - name: Save zvec build cache
        if: always() && steps.cache-zvec.outputs.cache-hit != 'true' && hashFiles('zvec/build/.zvec-build-ok') != ''
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: zvec/build
          key: zvec-build-${{ matrix.name }}-${{ matrix.cache_abi }}-${{ steps.zvec.outputs.sha }}

      # --- Package libraries ---
      - name: Package libraries (Unix)
        if: runner.os != 'Windows'
        run: |
          PLATFORM="${{ matrix.platform }}"
          mkdir -p staging/$PLATFORM staging/include/zvec

          # Copy shared library
          cp zvec/build/lib/${{ matrix.lib_name }} staging/$PLATFORM/
          echo "✓ Copied ${{ matrix.lib_name }}"

          # Copy public header
          cp zvec/src/include/zvec/c_api.h staging/include/zvec/
          echo "✓ Copied c_api.h"

          # Jieba dict: the jieba FTS tokenizer needs these files at runtime;
          # ship them under data/jieba_dict, mirroring the zvec SDK layout.
          mkdir -p staging/data/jieba_dict
          cp zvec/thirdparty/cppjieba/cppjieba-5.6.7/dict/jieba.dict.utf8 staging/data/jieba_dict/
          cp zvec/thirdparty/cppjieba/cppjieba-5.6.7/dict/hmm_model.utf8 staging/data/jieba_dict/
          echo "✓ Copied jieba dict"

          ls -la staging/$PLATFORM/
          du -h staging/$PLATFORM/${{ matrix.lib_name }}
        shell: bash

      - name: Verify the linux library stays glibc 2.28 compatible
        if: runner.os == 'Linux'
        shell: bash
        run: |
          LIMIT=2.28
          SO="staging/${{ matrix.platform }}/${{ matrix.lib_name }}"
          MAX=$(objdump -T "$SO" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "$SO: highest versioned GLIBC symbol = ${MAX:-none}"
          if [ -n "$MAX" ] && [ "$(printf '%s\n%s\n' "$MAX" "$LIMIT" | sort -V | tail -1)" != "$LIMIT" ]; then
            echo "::error::$SO requires GLIBC_$MAX but the floor is GLIBC_$LIMIT - it was not built inside the manylinux_2_28 container"
            exit 1
          fi

      - name: Package libraries (Windows)
        if: runner.os == 'Windows'
        run: |
          $platform = "${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "staging/$platform"   | Out-Null
          New-Item -ItemType Directory -Force -Path "staging/include/zvec" | Out-Null

          # Find DLL (location varies by CMake generator)
          $dllCandidates = @(
            "zvec/build/lib/Release/zvec_c_api.dll",
            "zvec/build/lib/zvec_c_api.dll",
            "zvec/build/bin/Release/zvec_c_api.dll"
          )
          $found = $false
          foreach ($p in $dllCandidates) {
            if (Test-Path $p) {
              Copy-Item $p "staging/$platform/"
              Write-Host "✓ Copied DLL from $p"
              $found = $true; break
            }
          }
          if (-not $found) {
            Write-Error "DLL not found"
            Get-ChildItem -Recurse zvec/build/ -Filter *.dll
            exit 1
          }

          # Import library (.lib) – optional but useful for downstream C/C++ consumers
          $libCandidates = @(
            "zvec/build/lib/Release/zvec_c_api.lib",
            "zvec/build/lib/zvec_c_api.lib"
          )
          foreach ($p in $libCandidates) {
            if (Test-Path $p) {
              Copy-Item $p "staging/$platform/"
              Write-Host "✓ Copied import lib from $p"
              break
            }
          }

          # Public header
          Copy-Item "zvec/src/include/zvec/c_api.h" "staging/include/zvec/"
          Write-Host "✓ Copied c_api.h"

          # Jieba dict (mirrors the zvec SDK layout data/jieba_dict)
          New-Item -ItemType Directory -Force -Path "staging/data/jieba_dict" | Out-Null
          Copy-Item "zvec/thirdparty/cppjieba/cppjieba-5.6.7/dict/jieba.dict.utf8" "staging/data/jieba_dict/"
          Copy-Item "zvec/thirdparty/cppjieba/cppjieba-5.6.7/dict/hmm_model.utf8" "staging/data/jieba_dict/"
          Write-Host "✓ Copied jieba dict"

          Get-ChildItem "staging/$platform/"
        shell: pwsh

      # --- Verify Maven build compiles against staged vendor libs ---
      - name: Verify Maven compile with vendor libs (Unix)
        if: runner.os != 'Windows'
        run: |
          PLATFORM="${{ matrix.platform }}"
          mkdir -p lib/$PLATFORM lib/include/zvec
          cp staging/$PLATFORM/* lib/$PLATFORM/
          cp staging/include/zvec/c_api.h lib/include/zvec/

          LIB_PATH="${{ github.workspace }}/lib/$PLATFORM"
          mvn compile -Dzvec.lib.path="$LIB_PATH" -B
          echo "✓ Maven compile succeeded with vendor libraries"
        shell: bash

      - name: Verify Maven compile with vendor libs (Windows)
        if: runner.os == 'Windows'
        run: |
          $platform = "${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "lib/$platform"    | Out-Null
          New-Item -ItemType Directory -Force -Path "lib/include/zvec" | Out-Null
          Copy-Item "staging/$platform/*" "lib/$platform/"
          Copy-Item "staging/include/zvec/c_api.h" "lib/include/zvec/"

          $libPath = "${{ github.workspace }}\lib\$platform"
          $env:PATH = "$libPath;$env:PATH"

          mvn compile "-Dzvec.lib.path=$libPath" -B
          Write-Host "✓ Maven compile succeeded with vendor libraries"
        shell: pwsh

      # --- Create release archive ---
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd staging
          tar -czf ../${{ matrix.artifact_name }}.tar.gz .
          cd ..
          sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          echo "=== Archive ==="
          ls -la ${{ matrix.artifact_name }}.tar.gz
          cat ${{ matrix.artifact_name }}.tar.gz.sha256
        shell: bash

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd staging
          Compress-Archive -Path * -DestinationPath ..\${{ matrix.artifact_name }}.zip
          cd ..
          $hash = (Get-FileHash "${{ matrix.artifact_name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact_name }}.zip.sha256"
          Write-Host "=== Archive ==="
          Get-ChildItem "${{ matrix.artifact_name }}.zip"
          Get-Content "${{ matrix.artifact_name }}.zip.sha256"
        shell: pwsh

      # --- Upload artifact for the release job ---
      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.zip.sha256

  # ===========================================================================
  # NOTE: the Maven JAR build & Central deployment intentionally live in the
  # standalone "Publish JAR" workflow (.github/workflows/publish-jar.yml),
  # which is manual-only. Once this release looks good, run it by hand with
  # the same tag to build the JAR family and (opt-in) deploy to Maven Central.
  # ===========================================================================

  # ===========================================================================
  # Create GitHub Release with all platform libraries
  # ===========================================================================
  release:
    name: Create Release
    needs: [ build-libs ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find ./artifacts -type f | sort
        shell: bash

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          cat > release-notes.md << EOF
          ## zvec-java ${TAG}

          Industrial-grade Java bindings for the [Zvec](https://github.com/alibaba/zvec) vector database C API.

          ### Pre-built C Libraries

          Download the archive for your platform and extract it to the \`lib/\` directory of your project:

          | Platform | Archive | Architecture |
          |----------|---------|--------------|
          | **macOS** | \`zvec-libs-darwin-arm64.tar.gz\` | Apple Silicon (arm64) |
          | **Linux** | \`zvec-libs-linux-x64.tar.gz\` | x86-64 |
          | **Windows** | \`zvec-libs-windows-x64.zip\` | x86-64 |

          ### Maven JAR

          The JAR family (multi-platform fat JAR, per-platform classifier JARs, nolib JAR) is
          published separately from this release: run the **Publish JAR** workflow manually with
          the tag \`${TAG}\` once this release has been verified. Afterwards the artifacts are
          available from Maven Central.

          ### Maven Dependency

          \`\`\`xml
          <dependency>
              <groupId>org.zvec</groupId>
              <artifactId>zvec-java</artifactId>
              <version>${VERSION}</version>
          </dependency>
          \`\`\`

          ### Quick Start

          \`\`\`bash
          # Extract pre-built library to lib/<platform>/
          tar -xzf zvec-libs-linux-x64.tar.gz -C lib/

          # Run with vendor library
          mvn test -Dzvec.lib.path=lib/linux_amd64
          \`\`\`

          ### SHA-256 Checksums

          See the \`.sha256\` files attached to this release for verification.
          EOF
          echo "notes_file=release-notes.md" >> $GITHUB_OUTPUT
        shell: bash

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          # Platform libraries
          find ./artifacts -name "*.tar.gz" -o -name "*.tar.gz.sha256" \
               -o -name "*.zip"    -o -name "*.zip.sha256" | while read f; do
            cp "$f" release-assets/
          done
          echo "=== Release assets ==="
          ls -lh release-assets/
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "zvec-java ${{ steps.tag.outputs.tag }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
