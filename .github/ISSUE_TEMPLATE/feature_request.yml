name: Feature Request
description: Ask for a new capability in the Java binding
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The binding tracks the zvec C API, so please say
        whether the capability already exists in `zvec/src/include/zvec/c_api.h`
        (a wrapper gap) or has to be added upstream first (an engine feature).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that zvec-java makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the Java API you would like to write
      placeholder: |
        try (DocIterator it = coll.createIterator(new IteratorOptions().setBatchSize(512))) {
            ...
        }
      render: java
    validations:
      required: true

  - type: dropdown
    id: c_api_support
    attributes:
      label: Is the underlying C API already there?
      options:
        - "Yes - c_api.h exposes it, the Java wrapper just does not"
        - "No - it needs an upstream zvec change first"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today
    validations:
      required: false
